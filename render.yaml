services:
  - type: web
    name: prince-ads-api
    env: node
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: PRINCE
      - key: ADMIN_PASSWORD
        value: VSICS2024
      - key: DATABASE_URL
        fromDatabase:
          name: prince-ads-db
          property: connectionString

databases:
  - name: prince-ads-db
    databaseName: prince_ads
    user: prince_user
    plan: free
