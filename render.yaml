services:
  - type: web
    name: prince-ads
    env: node
    rootDir: .
    buildCommand: npm run install-all && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: PRINCE
      - key: ADMIN_PASSWORD
        value: VSICS2024
      - key: CLIENT_URL
        sync: false
